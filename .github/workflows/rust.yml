name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose --all-features
    - name: Run tests
      run: cargo test --verbose --all-features

  clippy:
    name: Clippy

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    # RUSTFLAGS only covers rustc lints, so deny clippy's own lints explicitly.
    - name: Clippy
      run: cargo clippy --all-features --all-targets -- -D warnings

  feature-matrix:
    name: Feature matrix

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: taiki-e/install-action@cargo-hack
    - name: Build each feature in isolation
      run: cargo hack --each-feature --no-dev-deps build --verbose
    - name: Build each integration against every format
      run: |
        for integration in axum poem actix; do
          for format in json xml json,xml; do
            cargo hack --no-dev-deps build --verbose \
              --no-default-features --features "$integration,$format"
          done
        done
